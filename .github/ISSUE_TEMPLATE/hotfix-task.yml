name: Hotfix task
description: A small, focused repository or site fix.
labels: ["hotfix"]
body:
  - type: textarea
    id: scope
    attributes:
      label: Scope
      placeholder: What exactly needs to be fixed?
    validations:
      required: true
  - type: input
    id: deliverable
    attributes:
      label: Single deliverable
      placeholder: One commit, one fix.
    validations:
      required: true
  - type: dropdown
    id: effort
    attributes:
      label: Max effort
      options:
        - "< 30 min"
        - "< 1 hour"
        - "Needs separate planning"
    validations:
      required: true
  - type: textarea
    id: review_note
    attributes:
      label: Review note
      placeholder: What should be checked manually before merging?
