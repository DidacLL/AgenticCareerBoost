name: required-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: required-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate cover-letter JSON contract
        run: |
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          renderer_path = Path("application-tracker/render_letter.py")
          spec = importlib.util.spec_from_file_location("render_letter", renderer_path)
          renderer = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(renderer)

          schema = json.loads(Path("application-tracker/letter-input.schema.json").read_text(encoding="utf-8"))
          schema_keys = set(schema["properties"])
          assert schema["additionalProperties"] is False
          assert schema_keys == set(schema["required"])
          assert schema_keys == renderer.EXPECTED_KEYS
          PY

          tmpdir="$(mktemp -d)"
          cat > "$tmpdir/letter.json" <<'JSON'
          {
            "slug": "example-slug",
            "output_pdf": "example-cover-letter.pdf",
            "candidate_name": "Example Candidate",
            "headline": "Software Engineer",
            "email": "example@example.invalid",
            "portfolio_url": "https://example.invalid",
            "github_url": "https://example.invalid/github",
            "linkedin_url": "https://example.invalid/linkedin",
            "recipient": "Example Hiring Team",
            "role": "Software Engineer",
            "location": "Remote",
            "greeting": "Dear Example Hiring Team,",
            "paragraphs": ["This is fake example content."],
            "closing": "Sincerely,",
            "public_note": "Generated from fake local data.",
            "parser_summary": "Fake summary for validation.",
            "keywords": ["software", "engineering"]
          }
          JSON

          python application-tracker/render_letter.py \
            --input "$tmpdir/letter.json" \
            --output-dir "$tmpdir/generated"
          test -f "$tmpdir/generated/example-cover-letter.tex"

          python - "$tmpdir/letter.json" "$tmpdir/invalid.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          source = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          source["cv"] = {"this": "must be rejected"}
          Path(sys.argv[2]).write_text(json.dumps(source), encoding="utf-8")
          PY

          if python application-tracker/render_letter.py \
            --input "$tmpdir/invalid.json" \
            --output-dir "$tmpdir/invalid-generated"; then
            echo "Renderer accepted an unsupported wrapper field." >&2
            exit 1
          fi
      - name: Resolve career artifact build inputs
        id: career
        run: |
          python agents/cv/tools/artifact_manifest.py validate
          {
            echo 'tex_root_files<<EOF'
            python agents/cv/tools/artifact_manifest.py roots | sed 's#^tex/##'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Compile public CV from canonical TeX root
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: agents/cv/tex
          root_file: ${{ steps.career.outputs.tex_root_files }}
          args: -r ../latexmkrc -pdf -interaction=nonstopmode -halt-on-error -outdir=../build -auxdir=../build
      - name: Assert TeX source directory is clean
        run: |
          if find agents/cv/tex -maxdepth 1 -type f \( \
            -name '*.aux' -o -name '*.log' -o -name '*.out' -o -name '*.fls' -o \
            -name '*.fdb_latexmk' -o -name '*.synctex.gz' -o -name '*.toc' -o \
            -name '*.bbl' -o -name '*.bcf' -o -name '*.blg' -o -name '*.run.xml' \
          \) -print -quit | grep -q .; then
            echo 'TeX compilation polluted agents/cv/tex with generated files.' >&2
            exit 1
          fi
      - name: Publish public CV into portfolio artifact
        run: python agents/cv/tools/artifact_manifest.py publish
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - name: Install site dependencies
        run: npm install --prefix site --no-package-lock
      - name: Build Astro site
        run: npm run build --prefix site
        env:
          SITE_ORIGIN: https://example.invalid
          SITE_BASE: /
          SITE_INDEXABLE: "true"
      - name: Validate generated portfolio
        run: node site/scripts/verify-build.mjs site/dist / true https://example.invalid
      - name: Validate internal Markdown links
        run: bash agents/tools/validate_links.sh
