name: required-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: required-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Resolve career artifact build inputs
        id: career
        run: |
          python agents/cv/tools/artifact_manifest.py validate
          {
            echo 'root_files<<EOF'
            python agents/cv/tools/artifact_manifest.py roots
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Compile public CV
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: agents/cv
          root_file: ${{ steps.career.outputs.root_files }}
          args: -r latexmkrc -pdf -interaction=nonstopmode -halt-on-error
      - name: Compile CV directly from TeX source directory
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: agents/cv/tex
          root_file: didac-llorens-cv.tex
          args: -pdf -interaction=nonstopmode -halt-on-error
      - name: Publish public CV into portfolio artifact
        run: python agents/cv/tools/artifact_manifest.py publish
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - name: Install site dependencies
        run: npm install --prefix site --no-package-lock
      - name: Build Astro site
        run: npm run build --prefix site
        env:
          SITE_ORIGIN: https://example.invalid
          SITE_BASE: /
          SITE_INDEXABLE: "true"
      - name: Validate generated portfolio
        run: node site/scripts/verify-build.mjs site/dist / true https://example.invalid
      - name: Validate internal Markdown links
        run: bash agents/tools/validate_links.sh
