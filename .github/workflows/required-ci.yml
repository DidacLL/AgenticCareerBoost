name: required-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: required-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate public CV artifact contract
        run: python agents/cv/tools/artifact_manifest.py validate
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - name: Install site dependencies
        run: npm install --prefix site --no-package-lock
      - name: Build Astro site
        run: npm run build --prefix site
        env:
          SITE_ORIGIN: https://example.invalid
          SITE_BASE: /
          SITE_INDEXABLE: "true"
      - name: Validate generated portfolio
        run: node site/scripts/verify-build.mjs site/dist / true https://example.invalid
      - name: Validate internal Markdown links
        run: bash agents/tools/validate_links.sh
