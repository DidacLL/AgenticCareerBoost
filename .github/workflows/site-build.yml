name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/site-build.yml"
      - "site/**"
      - "agents/cv/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Resolve career artifact build inputs
        id: career
        run: |
          python agents/cv/tools/artifact_manifest.py validate
          {
            echo 'tex_root_files<<EOF'
            python agents/cv/tools/artifact_manifest.py roots | sed 's#^tex/##'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Compile public CV from canonical TeX root
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: agents/cv/tex
          root_file: ${{ steps.career.outputs.tex_root_files }}
          args: -r ../latexmkrc -pdf -interaction=nonstopmode -halt-on-error -outdir=../build -auxdir=../build
      - name: Assert TeX source directory is clean
        run: |
          if find agents/cv/tex -maxdepth 1 -type f \( \
            -name '*.aux' -o -name '*.log' -o -name '*.out' -o -name '*.fls' -o \
            -name '*.fdb_latexmk' -o -name '*.synctex.gz' -o -name '*.toc' -o \
            -name '*.bbl' -o -name '*.bcf' -o -name '*.blg' -o -name '*.run.xml' \
          \) -print -quit | grep -q .; then
            echo 'TeX compilation polluted agents/cv/tex with generated files.' >&2
            exit 1
          fi
      - name: Publish public CV into portfolio artifact
        run: python agents/cv/tools/artifact_manifest.py publish
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - name: Install site dependencies
        run: npm install --prefix site --no-package-lock
      - name: Build Astro site
        run: npm run build --prefix site
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
          SITE_INDEXABLE: "false"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
