name: Site check

on:
  push:
    branches: [DidacLl/siterefactor]

permissions:
  contents: read

concurrency:
  group: site-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate public CV artifact contract
        run: python agents/cv/tools/artifact_manifest.py validate
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - name: Install pinned site dependencies
        run: npm install --prefix site --no-package-lock
      - name: Build canonical root site
        run: npm run build --prefix site
        env:
          SITE_ORIGIN: https://example.invalid
          SITE_BASE: /
          SITE_INDEXABLE: "true"
      - name: Verify canonical root artifact
        run: node site/scripts/verify-build.mjs site/dist / true https://example.invalid
      - name: Build project-base mirror
        run: npm run build --prefix site
        env:
          SITE_ORIGIN: https://example.invalid
          SITE_BASE: /AgenticCareerBoost/
          SITE_INDEXABLE: "false"
      - name: Verify project-base artifact
        run: node site/scripts/verify-build.mjs site/dist /AgenticCareerBoost/ false https://example.invalid
      - name: Install browser smoke dependency
        run: npm install --prefix site --no-save playwright@1.62.1
      - name: Install Chromium
        run: npx --prefix site playwright install --with-deps chromium
      - name: Rebuild root site for browser smoke
        run: npm run build --prefix site
        env:
          SITE_ORIGIN: https://example.invalid
          SITE_BASE: /
          SITE_INDEXABLE: "true"
      - name: Browser functional smoke
        run: node site/scripts/browser-smoke.mjs site/dist
      - name: Record branch build context
        run: printf '{"sha":"%s","base":"/","indexable":true}\n' "$GITHUB_SHA" > site/dist/build-summary.json
      - name: Upload exact-SHA branch build
        uses: actions/upload-artifact@v4
        with:
          name: site-branch-${{ github.sha }}
          path: site/dist
          if-no-files-found: error
          retention-days: 3
